name: Deploy Gatsby Site

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.8.0'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Restore Gatsby cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public
          key: gatsby-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            gatsby-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            gatsby-${{ runner.os }}-

      - name: Build Gatsby site
        env:
          GATSBY_GA4_MEASUREMENT_ID: ${{ secrets.GATSBY_GA4_MEASUREMENT_ID }}
          GATSBY_RECAPTCHA_SITE_KEY: ${{ secrets.GATSBY_RECAPTCHA_SITE_KEY }}
        run: yarn build

      - name: Build Node.js server
        run: yarn build:server

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts
          rsync -az --delete --info=stats2 \
            --exclude '.env.production' \
            --exclude '.deployed-yarn.lock' \
            --exclude 'dist' \
            --exclude 'ecosystem.config.js' \
            --exclude 'node_modules' \
            --exclude 'package.json' \
            --exclude 'yarn.lock' \
            public/ $SERVER_USER@$SERVER_HOST:$SERVER_PATH
          rsync -az --delete --info=stats2 dist/ $SERVER_USER@$SERVER_HOST:$SERVER_PATH/dist
          scp ecosystem.config.js package.json yarn.lock $SERVER_USER@$SERVER_HOST:$SERVER_PATH/
          ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && if [ ! -d node_modules ] || [ ! -f .deployed-yarn.lock ] || ! cmp -s yarn.lock .deployed-yarn.lock; then command -v yarn >/dev/null 2>&1 || npm install -g yarn@1.22.22; yarn install --production --frozen-lockfile --prefer-offline && cp yarn.lock .deployed-yarn.lock; fi"

      - name: Restart PM2 server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
          ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && (pm2 reload ecosystem.config.js --env production --update-env || pm2 start ecosystem.config.js --env production) && pm2 save"
